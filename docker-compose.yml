# Базы для разработки. Сам snag запускается локально: go run ./cmd/snag.
# Порты сдвинуты от стандартных, чтобы не мешать другим проектам на машине.
name: snag

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: snag
      POSTGRES_PASSWORD: snag
      POSTGRES_DB: snag
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snag -d snag"]
      interval: 2s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: snag
      CLICKHOUSE_PASSWORD: snag
      CLICKHOUSE_DB: snag
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
    ports:
      - "127.0.0.1:18123:8123"
      - "127.0.0.1:19000:9000"
    volumes:
      - ch:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client -u snag --password snag -q 'SELECT 1'"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pg:
  ch:
