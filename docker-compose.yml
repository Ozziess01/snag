# docker compose up -d --build — Snag вместе с базами:
#   http://localhost:8000, вход admin@snag.local / snag-admin (смените!)
#
# Для разработки (snag запускается через go run) хватит баз:
#   docker compose up -d postgres clickhouse
# Порты баз сдвинуты от стандартных, чтобы не мешать другим проектам.
name: snag

services:
  snag:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SNAG_PUBLIC_URL: ${SNAG_PUBLIC_URL:-http://localhost:8000}
      SNAG_PG_DSN: postgres://snag:snag@postgres:5432/snag?sslmode=disable
      SNAG_CH_DSN: clickhouse://snag:snag@clickhouse:9000/snag
      SNAG_ADMIN_EMAIL: ${SNAG_ADMIN_EMAIL:-admin@snag.local}
      SNAG_ADMIN_PASSWORD: ${SNAG_ADMIN_PASSWORD:-snag-admin}
      SNAG_TELEGRAM_TOKEN: ${SNAG_TELEGRAM_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: snag
      POSTGRES_PASSWORD: snag
      POSTGRES_DB: snag
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snag -d snag"]
      interval: 2s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: snag
      CLICKHOUSE_PASSWORD: snag
      CLICKHOUSE_DB: snag
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
    ports:
      - "127.0.0.1:18123:8123"
      - "127.0.0.1:19000:9000"
    volumes:
      - ch:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client -u snag --password snag -q 'SELECT 1'"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pg:
  ch:
